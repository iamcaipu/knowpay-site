<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="教程插画：路线与九步">
  <!-- 底色透明，容器给色；用色锁定站点色盘 -->
  <!-- 航线虚线 -->
  <path d="M60 170 C 150 120, 230 190, 300 140 S 430 70, 470 60" fill="none" stroke="#1D5B6B" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- 左：清单卡 -->
  <g>
    <rect x="42" y="52" width="120" height="96" rx="10" fill="#114453" stroke="#1D5B6B" stroke-width="2"/>
    <rect x="56" y="68" width="52" height="9" rx="4.5" fill="#4E9EC4"/>
    <rect x="56" y="88" width="88" height="7" rx="3.5" fill="#8FB8BF" opacity="0.75"/>
    <rect x="56" y="103" width="72" height="7" rx="3.5" fill="#8FB8BF" opacity="0.75"/>
    <rect x="56" y="118" width="80" height="7" rx="3.5" fill="#8FB8BF" opacity="0.55"/>
    <circle cx="146" cy="72" r="9" fill="#E8760A"/>
    <path d="M142 72 L145 75 L151 68" stroke="#F2F8F9" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 中：罗盘时钟（橙色点缀） -->
  <g>
    <circle cx="262" cy="96" r="44" fill="#0F3B48" stroke="#E8760A" stroke-width="5"/>
    <path d="M262 66 L262 96 L284 108" stroke="#F2F8F9" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="262" cy="96" r="4" fill="#E8760A"/>
    <!-- 指北针刻度 -->
    <path d="M262 46 L266 54 L258 54 Z" fill="#4E9EC4"/>
    <path d="M262 146 L266 138 L258 138 Z" fill="#1D5B6B"/>
    <path d="M212 96 L220 100 L220 92 Z" fill="#1D5B6B"/>
    <path d="M312 96 L304 100 L304 92 Z" fill="#1D5B6B"/>
  </g>
  <!-- 右：店铺 -->
  <g>
    <rect x="368" y="84" width="106" height="72" rx="8" fill="#114453" stroke="#1D5B6B" stroke-width="2"/>
    <!-- 雨棚条纹 -->
    <rect x="362" y="70" width="118" height="18" rx="6" fill="#4E9EC4"/>
    <rect x="362" y="70" width="24" height="18" fill="#0B2E36" opacity="0.55"/>
    <rect x="410" y="70" width="24" height="18" fill="#0B2E36" opacity="0.55"/>
    <rect x="458" y="70" width="22" height="18" fill="#0B2E36" opacity="0.55"/>
    <rect x="380" y="104" width="34" height="26" rx="4" fill="#0F3B48" stroke="#1D5B6B" stroke-width="2"/>
    <rect x="424" y="104" width="34" height="26" rx="4" fill="#0F3B48" stroke="#1D5B6B" stroke-width="2"/>
    <circle cx="466" cy="140" r="8" fill="#E8760A"/>
  </g>
  <!-- 节点圆点 -->
  <circle cx="60" cy="170" r="7" fill="#4E9EC4"/>
  <circle cx="300" cy="140" r="7" fill="#4E9EC4"/>
  <circle cx="470" cy="60" r="8" fill="#E8760A"/>
</svg>
